name: Deploy PowerBI Fabric

on:
  pull_request:
    branches:
      - dev
    paths:
      - fabric/**/Reports/**
      - fabric/**/SemanticModels/**
    types:
      - closed

  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Branch to deploy"
        required: true
        default: dev
      target_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PROD

permissions:
  contents: read

jobs:
  DeployPowerBI:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
       ||
       github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'DEV' }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fabric-cicd \
            azure-identity \
            python-dotenv

      - name: Resolve workspace
        id: workspace
        run: |
          ENV=${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'DEV' }}

          if [ "$ENV" = "PROD" ]; then
            echo "workspace=${{ secrets.PROD_WORKSPACE_ID }}" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "UAT" ]; then
            echo "workspace=${{ secrets.TEST_WORKSPACE_ID }}" >> $GITHUB_OUTPUT
          else
            echo "workspace=${{ secrets.DEV_WORKSPACE_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy PowerBI
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          python cicd/scripts/github-action/deploy_powerbi.py \
            --aztenantid "$AZURE_TENANT_ID" \
            --azclientid "$AZURE_CLIENT_ID" \
            --azspsecret "$AZURE_CLIENT_SECRET" \
            --workspaceid "${{ steps.workspace.outputs.workspace }}" \
            --target_env "${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'UAT' }}"